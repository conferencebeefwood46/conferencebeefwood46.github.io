<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Caller</title>
<style>
  :root {
    --white: #ffffff;
    --black: #000000;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: var(--black);
    color: var(--white);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
  }

  body {
    position: relative;
  }

  /* Timer, top center */
  #timer {
    position: fixed;
    top: 48px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Courier New', monospace;
    font-size: 18px;
    letter-spacing: 3px;
    color: rgba(255, 255, 255, 0.55);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  #timer.visible {
    opacity: 1;
  }

  /* Word display, dead center */
  #wordDisplay {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1);
    text-align: center;
    font-size: 84px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--white);
    opacity: 0;
    transition: opacity 0.15s ease, transform 0.15s ease;
    width: 100%;
    pointer-events: none;
  }

  #wordDisplay.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  /* Thin frame for a bit of visual structure, monochrome only */
  .frame {
    position: fixed;
    top: 24px;
    left: 24px;
    right: 24px;
    bottom: 24px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    pointer-events: none;
  }

  /* Session summary, shown after stop */
  #summary {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, calc(-50% + 90px));
    font-family: 'Courier New', monospace;
    font-size: 14px;
    letter-spacing: 2px;
    color: rgba(255, 255, 255, 0.5);
    opacity: 0;
    transition: opacity 0.4s ease;
    text-align: center;
    width: 100%;
  }

  #summary.visible {
    opacity: 1;
  }

  #startBtn {
    position: fixed;
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--white);
    color: var(--black);
    border: 1px solid var(--white);
    padding: 18px 56px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 4px;
    cursor: pointer;
    text-transform: uppercase;
    border-radius: 999px;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }

  #startBtn:hover {
    transform: translateX(-50%) scale(1.04);
  }

  #startBtn:active {
    transform: translateX(-50%) scale(0.97);
  }

  #startBtn.active {
    background: transparent;
    color: var(--white);
    border: 1px solid var(--white);
  }
</style>
</head>
<body>

<div class="frame"></div>
<div id="timer">00:00</div>
<div id="wordDisplay"></div>
<div id="summary"></div>
<button id="startBtn">Start</button>

<script>
  const words = ["left", "right", "both"];
  const DELAY = 1500; // fixed 1.5 seconds

  let running = false;
  let intervalId = null;
  let keepAliveId = null;
  let timerIntervalId = null;
  let voices = [];
  let currentUtterance = null; // kept in outer scope to avoid a Chrome bug that silently drops speech
  let startTime = 0;

  const wordDisplay = document.getElementById('wordDisplay');
  const startBtn = document.getElementById('startBtn');
  const timerEl = document.getElementById('timer');
  const summaryEl = document.getElementById('summary');

  function loadVoices() {
    voices = window.speechSynthesis.getVoices();
  }
  loadVoices();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    currentUtterance = new SpeechSynthesisUtterance(text);
    currentUtterance.rate = 1;
    currentUtterance.pitch = 1;
    currentUtterance.volume = 1;
    if (voices.length > 0) {
      const englishVoice = voices.find(v => v.lang && v.lang.startsWith('en'));
      currentUtterance.voice = englishVoice || voices[0];
    }
    window.speechSynthesis.speak(currentUtterance);
  }

  function formatTime(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
    const seconds = (totalSeconds % 60).toString().padStart(2, '0');
    return `${minutes}:${seconds}`;
  }

  function updateTimer() {
    timerEl.textContent = formatTime(Date.now() - startTime);
  }

  function tick() {
    const word = words[Math.floor(Math.random() * words.length)];
    // brief flicker to make each new word feel distinct, even on repeats
    wordDisplay.classList.remove('show');
    void wordDisplay.offsetWidth; // force reflow so the transition restarts
    wordDisplay.textContent = word;
    wordDisplay.classList.add('show');
    speak(word);
  }

  startBtn.addEventListener('click', () => {
    running = !running;

    if (running) {
      summaryEl.classList.remove('visible');
      summaryEl.textContent = '';

      startBtn.textContent = "Stop";
      startBtn.classList.add('active');

      startTime = Date.now();
      timerEl.textContent = '00:00';
      timerEl.classList.add('visible');
      timerIntervalId = setInterval(updateTimer, 1000);

      // unlock/resume speech synthesis on user gesture, then start immediately
      window.speechSynthesis.resume();
      tick();
      intervalId = setInterval(tick, DELAY);

      // Chrome silently pauses speechSynthesis after ~15s of inactivity; nudge it periodically
      keepAliveId = setInterval(() => {
        window.speechSynthesis.resume();
      }, 5000);

    } else {
      const elapsed = Date.now() - startTime;

      startBtn.textContent = "Start";
      startBtn.classList.remove('active');

      wordDisplay.classList.remove('show');
      wordDisplay.textContent = '';

      timerEl.classList.remove('visible');

      clearInterval(intervalId);
      clearInterval(keepAliveId);
      clearInterval(timerIntervalId);
      window.speechSynthesis.cancel();

      summaryEl.textContent = `Session duration — ${formatTime(elapsed)}`;
      summaryEl.classList.add('visible');
    }
  });
</script>

</body>
</html>
