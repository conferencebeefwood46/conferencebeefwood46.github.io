<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Caller</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background: #000000;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #startBtn {
    background: #ffffff;
    color: #000000;
    border: 2px solid #ffffff;
    padding: 20px 60px;
    font-size: 24px;
    letter-spacing: 2px;
    cursor: pointer;
    text-transform: uppercase;
  }

  #startBtn:hover {
    background: #000000;
    color: #ffffff;
  }

  #startBtn.active {
    background: #000000;
    color: #ffffff;
  }
</style>
</head>
<body>

<button id="startBtn">Start</button>

<script>
  const words = ["left", "right", "both"];
  let running = false;
  let intervalId = null;
  let voices = [];

  const DELAY = 1000; // fixed 1 second

  function loadVoices() {
    voices = window.speechSynthesis.getVoices();
  }

  loadVoices();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;
    if (voices.length > 0) {
      const englishVoice = voices.find(v => v.lang && v.lang.startsWith('en'));
      utterance.voice = englishVoice || voices[0];
    }
    window.speechSynthesis.speak(utterance);
  }

  function tick() {
    const word = words[Math.floor(Math.random() * words.length)];
    speak(word);
  }

  const startBtn = document.getElementById('startBtn');

  startBtn.addEventListener('click', () => {
    running = !running;
    if (running) {
      startBtn.textContent = "Stop";
      startBtn.classList.add('active');
      // unlock/resume speech synthesis on user gesture, then start immediately
      window.speechSynthesis.resume();
      tick();
      intervalId = setInterval(tick, DELAY);
    } else {
      startBtn.textContent = "Start";
      startBtn.classList.remove('active');
      clearInterval(intervalId);
      window.speechSynthesis.cancel();
    }
  });
</script>

</body>
</html>
